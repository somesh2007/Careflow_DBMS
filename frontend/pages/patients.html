<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CareFlow — Patients</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <span class="brand-icon">⚕</span>
        <span class="brand-name">CareFlow</span>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-link">▦ Dashboard</a>
        <a href="doctors.html"  class="nav-link">⚕ Doctors</a>
        <a href="patients.html" class="nav-link active">♡ Patients</a>
        <a href="appointments.html" class="nav-link">◷ Appointments</a>
      </nav>
      <div class="sidebar-footer">
        <div class="admin-info">
          <div class="admin-avatar">AD</div>
          <div>
            <div class="admin-name" id="adminName">Admin</div>
            <div class="admin-role">Hospital Admin</div>
          </div>
        </div>
        <button class="btn-logout" id="logoutBtn">⏻</button>
      </div>
    </aside>

    <main class="main-content">
      <div class="page-header">
        <div>
          <h2 class="page-title">Patients</h2>
          <p class="page-sub">Manage patient records and information.</p>
        </div>
        <button class="btn btn-primary" id="addPatientBtn">+ Add Patient</button>
      </div>

      <div class="card">
        <div class="table-toolbar">
          <input type="text" class="search-input" id="searchInput" placeholder="Search patients..." />
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Patient</th>
                <th>Details</th>
                <th>Contact</th>
                <th>Address</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="patientsTbody">
              <tr><td colspan="5" class="loading-cell">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Patient Modal -->
  <div class="modal-overlay hidden" id="patientModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle">Add New Patient</h3>
        <button class="modal-close" id="closeModal">✕</button>
      </div>
      <p class="modal-sub">Enter the patient's details below.</p>
      <form id="patientForm">
        <input type="hidden" id="patientId" />
        <div class="form-row">
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="patName" placeholder="John Doe" required />
          </div>
        </div>
        <div class="form-row two-col">
          <div class="form-group">
            <label>Age</label>
            <input type="number" id="patAge" placeholder="30" min="0" max="130" required />
          </div>
          <div class="form-group">
            <label>Gender</label>
            <select id="patGender" required>
              <option value="">Select</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>
        <div class="form-row two-col">
          <div class="form-group">
            <label>Phone</label>
            <input type="text" id="patPhone" placeholder="+1 234 567 8900" required />
          </div>
          <div class="form-group">
            <label>Blood Group</label>
            <select id="patBlood" required>
              <option value="">Select</option>
              <option>A+</option><option>A-</option>
              <option>B+</option><option>B-</option>
              <option>O+</option><option>O-</option>
              <option>AB+</option><option>AB-</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Address</label>
            <input type="text" id="patAddress" placeholder="123 Main St, City" required />
          </div>
        </div>
        <div id="formError" class="error-msg hidden"></div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-primary" id="submitBtn">Create Patient</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/common.js"></script>
  <script src="../js/patients.js"></script>
</body>
</html>
