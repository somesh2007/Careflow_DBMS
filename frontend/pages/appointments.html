<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CareFlow — Appointments</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <span class="brand-icon">⚕</span>
        <span class="brand-name">CareFlow</span>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-link">▦ Dashboard</a>
        <a href="doctors.html"  class="nav-link">⚕ Doctors</a>
        <a href="patients.html" class="nav-link">♡ Patients</a>
        <a href="appointments.html" class="nav-link active">◷ Appointments</a>
      </nav>
      <div class="sidebar-footer">
        <div class="admin-info">
          <div class="admin-avatar">AD</div>
          <div>
            <div class="admin-name" id="adminName">Admin</div>
            <div class="admin-role">Hospital Admin</div>
          </div>
        </div>
        <button class="btn-logout" id="logoutBtn">⏻</button>
      </div>
    </aside>

    <main class="main-content">
      <div class="page-header">
        <div>
          <h2 class="page-title">Appointments</h2>
          <p class="page-sub">Schedule and manage hospital visits.</p>
        </div>
        <button class="btn btn-primary" id="addApptBtn">+ New Appointment</button>
      </div>

      <div class="card">
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Date &amp; Time</th>
                <th>Patient</th>
                <th>Doctor</th>
                <th>Reason</th>
                <th>Status</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="apptTbody">
              <tr><td colspan="6" class="loading-cell">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Appointment Modal -->
  <div class="modal-overlay hidden" id="apptModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle">Schedule Appointment</h3>
        <button class="modal-close" id="closeModal">✕</button>
      </div>
      <p class="modal-sub">Book a new visit for a patient.</p>
      <form id="apptForm">
        <input type="hidden" id="apptId" />
        <div class="form-row">
          <div class="form-group">
            <label>Patient</label>
            <select id="apptPatient" required>
              <option value="">Select patient</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Doctor</label>
            <select id="apptDoctor" required>
              <option value="">Select doctor</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Date &amp; Time</label>
            <input type="datetime-local" id="apptDate" required />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Reason for Visit</label>
            <input type="text" id="apptReason" placeholder="Annual checkup" required />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Status</label>
            <select id="apptStatus">
              <option value="scheduled">Scheduled</option>
              <option value="completed">Completed</option>
              <option value="cancelled">Cancelled</option>
            </select>
          </div>
        </div>
        <div id="formError" class="error-msg hidden"></div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-primary" id="submitBtn">Schedule</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Status Dropdown Menu -->
  <div class="dropdown-menu hidden" id="statusMenu">
    <button class="dropdown-item" data-status="scheduled">Mark Scheduled</button>
    <button class="dropdown-item" data-status="completed">Mark Completed</button>
    <button class="dropdown-item" data-status="cancelled">Mark Cancelled</button>
    <hr class="dropdown-divider" />
    <button class="dropdown-item danger" id="deleteApptBtn">Delete</button>
  </div>

  <script src="../js/common.js"></script>
  <script src="../js/appointments.js"></script>
</body>
</html>
